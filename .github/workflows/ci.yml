name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --omit=optional @anthropic-ai/claude-agent-sdk@0.3.258
      - run: npm test
      - run: swiftc -parse-as-library -typecheck menubar.swift
